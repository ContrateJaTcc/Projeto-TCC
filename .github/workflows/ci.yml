# A cada push e pull request: lint, build e os testes de ponta a ponta (modo demonstração, sem servidor)
name: CI

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultado-dos-testes
          path: test-results
          retention-days: 7
