<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" shape-rendering="crispEdges"><style>.a{animation:quadroA 6.5s infinite;animation-timing-function:steps(1,end)}
.b{opacity:0;animation:quadroB 6.5s infinite;animation-timing-function:steps(1,end)}
.olho{opacity:0;animation:olho 9s ease-in-out infinite}
