<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" shape-rendering="crispEdges"><style>.n1{animation:deriva 60s steps(480,end) infinite}
.n2{animation:deriva 44s steps(480,end) infinite reverse}
.pulso{opacity:.04;animation:pulso 1.8s ease-in-out infinite}
.olhos{opacity:0;animation:olhar 5.5s ease-in-out infinite}
.bruxa{transform:translateX(-20px);animation:voar 5s steps(60,end) infinite;animation-delay:.25s}
@keyframes deriva{to{transform:translateX(-480px)}}
@keyframes pulso{50%{opacity:.2}}
@keyframes olhar{0%,100%{opacity:0}12%,30%{opacity:.85}45%{opacity:0}}
@keyframes voar{0%{transform:translate(150px,0)}30%{transform:translate(330px,-10px)}31%,100%{transform:translate(-20px,0)}}</style><g class="n1"><image href="data:image/png;base64," x="0" y="178" width="480" height="40" style="image-rendering:pixelated" preserveAspectRatio="none"/><image href="data:image/png;base64," x="480" y="178" width="480" height="40" style="image-rendering:pixelated" preserveAspectRatio="none"/></g><g class="n2"><image href="data:image/png;base64," x="0" y="226" width="480" height="44" style="image-rendering:pixelated" preserveAspectRatio="none"/><image href="data:image/png;base64," x="480" y="226" width="480" height="44" style="image-rendering:pixelated" preserveAspectRatio="none"/></g><ellipse class="pulso" cx="240" cy="160" rx="22" ry="42" fill="#c9a0ff"/><g class="olhos" style="animation-delay:0.5s" fill="#c9a0ff"><rect x="96" y="190" width="1" height="1"/><rect x="98" y="190" width="1" height="1"/></g><g class="olhos" style="animation-delay:1.4s" fill="#c9a0ff"><rect x="402" y="186" width="1" height="1"/><rect x="404" y="186" width="1" height="1"/></g><g class="bruxa" fill="#07010d"><rect x="5" y="118" width="1" height="1"/><rect x="4" y="119" width="2" height="1"/><rect x="3" y="120" width="3" height="1"/><rect x="2" y="121" width="5" height="1"/><rect x="4" y="122" width="2" height="1"/><rect x="0" y="123" width="11" height="1"/><rect x="0" y="124" width="2" height="1"/><rect x="5" y="124" width="1" height="1"/><rect x="7" y="124" width="1" height="1"/></g></svg>